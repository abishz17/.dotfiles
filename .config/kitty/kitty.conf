# vim:fileencoding=utf-8

# Theme first — everything below can override it
include themes/rosepine-moon.conf

# --- Fonts ---
font_family      JetBrains Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        13.0
adjust_line_height 110%

# --- Window Layout ---
window_padding_width 15
# Translucent default so it survives config reloads; fine-tune with ⌘⌥- / ⌘⌥=
background_opacity 1 
# Blur only takes effect while translucent (see Background Opacity keys below)
background_blur 20
dynamic_background_opacity yes
hide_window_decorations titlebar-only
macos_option_as_alt yes
macos_titlebar_color background
macos_traditional_fullscreen yes
# 0.47+: let traditional fullscreen fill the notch area (MacBooks)
macos_fullscreen_ignore_safe_area_insets yes
macos_show_window_title_in menubar
macos_quit_when_last_window_closed yes
confirm_os_window_close 0
remember_window_size  yes
initial_window_width  1000
initial_window_height 650

# --- Cursor ---
cursor_shape beam
cursor_blink_interval 0.5
cursor_trail 3

# --- Scrolling & Copy ---
scrollback_lines 10000
touch_scroll_multiplier 2.0
copy_on_select yes
strip_trailing_spaces smart
# Hide the mouse the instant you start typing (keyboard-first)
mouse_hide_wait -1

# --- Notifications ---
# Desktop notification when a long command finishes (needs shell_integration)
notify_on_cmd_finish unfocused

# --- Tab Bar ---
tab_bar_edge bottom
tab_bar_style custom
tab_bar_margin_width 0.0
tab_bar_margin_height 0.0 0.0
tab_bar_min_tabs 1
active_tab_font_style bold
inactive_tab_font_style normal

# --- Performance ---
repaint_delay 10
input_delay 3
sync_to_monitor yes

# --- Layouts ---
enabled_layouts splits,stack,tall

# --- Colors (256-palette) ---
# 0.47+: derive the 240 unset 256-color entries from our 16 Rosé Pine colors
# instead of the legacy fixed palette (keeps TUI apps theme-consistent)
palette_generate legacy

# --- Keyboard Shortcuts ---

# Tab Switching (Cmd + Number)
map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5
map cmd+6 goto_tab 6
map cmd+7 goto_tab 7
map cmd+8 goto_tab 8
map cmd+9 goto_tab 9

# Font size control
map cmd+plus change_font_size all +2.0
map cmd+kp_add change_font_size all +2.0
map cmd+minus change_font_size all -2.0
map cmd+kp_subtract change_font_size all -2.0
map cmd+equal change_font_size all 0

# Tab Management
map cmd+t new_tab_with_cwd
map cmd+w close_tab
map cmd+right next_tab
map cmd+left previous_tab
map cmd+shift+right move_tab_forward
map cmd+shift+left move_tab_backward

# Window Splitting (Productive)
map cmd+enter launch --location=vsplit --cwd=current
map cmd+shift+enter launch --location=hsplit --cwd=current

# Window Navigation
map cmd+j neighboring_window down
map cmd+k neighboring_window up
map cmd+h neighboring_window left
map cmd+l neighboring_window right

# Window Resizing
map cmd+shift+h resize_window narrower
map cmd+shift+l resize_window wider
map cmd+shift+k resize_window taller
map cmd+shift+j resize_window shorter

# Window Management
map cmd+ctrl+f toggle_fullscreen

# Reload Config
map cmd+ctrl+, load_config_file

# Search (Paul Nameless's Elite Vim-Ansi version)
map cmd+f pipe @ansi overlay /Users/abish/.config/kitty/vim-ansi.sh

# Broadcast (Type in all windows in tab)
map cmd+alt+b launch --type=overlay --stdin-source=@screen_scrollback kitty +kitten broadcast

# Zoom / Stack layout toggle
map cmd+z toggle_layout stack



shell /opt/homebrew/bin/nu

# --- Advanced Features ---
allow_remote_control yes
listen_on unix:/tmp/mykitty
shell_integration enabled

# Unicode input
map cmd+ctrl+u kitten unicode_input

# --- Hints ---
map cmd+e open_url_with_hints
map cmd+p kitten hints --type path --program -
map cmd+shift+p kitten hints --type path --program - --multiple
map cmd+g kitten hints --type hash --program -
map cmd+f1 kitten hints --type line --program -
map cmd+shift+c kitten hints --type path --program @
map cmd+i launch --type=overlay kitty +kitten icat --hold .
map cmd+shift+s launch --type=overlay --cwd=current
# ctrl+f inside nvim → sessionizer overlay (nvim sets var:in_editor; in nu, ctrl+f is bound in config.nu)
map --when-focus-on var:in_editor ctrl+f launch --type=overlay --cwd=current /opt/homebrew/bin/tv sessionizer

# Background Opacity Control
map cmd+opt+equal set_background_opacity +0.05
map cmd+opt+minus set_background_opacity -0.05
map cmd+opt+0 set_background_opacity default

# Clear line
map cmd+backspace send_text all \x15

# --- 0.45+: choose-files ---
# fzf-style file picker with previews; after choosing, press ctrl+shift+p>c
# (built-in default binding) to insert the path into the shell prompt
map cmd+ctrl+o launch --type=overlay kitten choose-files

# --- 0.43+: sessions ---
# Save the current tabs/windows as a .kitty-session file (restore with
# `kitty --session <file>`, or drag-and-drop the file into kitty)
map cmd+ctrl+s save_as_session

# --- Symbols ---
# Nerd Font glyph fallback for icons used in the tab bar & prompts
symbol_map U+e000-U+e00a,U+ea60-U+ebeb,U+e0a0-U+e0c8,U+e0ca,U+e0cc-U+e0d4,U+e200-U+e2a9,U+e300-U+e3e3,U+e5fa-U+e6b1,U+e700-U+e7c5,U+f000-U+f2e0,U+f300-U+f372,U+f400-U+f532,U+f0001-U+f1af0 Hack Nerd Font Mono

# --- Power-user kittens (internet favorites) ---
# Fuzzy tab switcher across all tabs
map cmd+shift+t select_tab
# Command palette, mac-style (the built-in is ctrl+shift+f3)
map cmd+shift+o command_palette
# File transfer over the TTY — works inside container/SSH sessions
map cmd+shift+u kitten transfer --direction=upload
map cmd+ctrl+g kitten transfer --direction=download
